services:
  mongo:
    image: mongo:7
    container_name: hostel-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    image: ${BACKEND_IMAGE}
    container_name: hostel-backend
    restart: always
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/hostelops}
    depends_on:
      - mongo

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: hostel-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
