name: Deploy

on:
  workflow_run:
    workflows: ["CI-CD"]
    types: [completed]

jobs:
  deploy:
    name: Deploy To Server
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercased owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Copy deploy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/docker-compose.server.yml"
          target: ${{ secrets.SERVER_APP_DIR }}
          strip_components: 1

      - name: Deploy with Docker Compose over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: OWNER,GHCR_USERNAME,GHCR_TOKEN,SERVER_APP_DIR,JWT_SECRET,MONGO_URI
          script: |
            set -e
            mkdir -p "$SERVER_APP_DIR"
            cd "$SERVER_APP_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export BACKEND_IMAGE="ghcr.io/$OWNER/hostel-backend:latest"
            export FRONTEND_IMAGE="ghcr.io/$OWNER/hostel-frontend:latest"

            docker compose -f docker-compose.server.yml pull
            docker compose -f docker-compose.server.yml up -d --remove-orphans
            docker image prune -f
